<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Minecraft на вашем сайте</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #78a7ff;
            font-family: sans-serif;
            user-select: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 5px;
            color: white;
            pointer-events: none;
            text-align: center;
            font-size: 14px;
        }
        #block-preview {
            display: inline-block;
            width: 20px;
            height: 20px;
            vertical-align: middle;
            margin-left: 10px;
            border: 2px solid white;
        }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            line-height: 1.5;
        }
    </style>
    <!-- Подключаем библиотеку Three.js для работы с 3D -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="crosshair">+</div>
    <div id="instructions">
        <strong>Управление:</strong><br>
        • Клик по экрану — захват мыши<br>
        • WASD / ЦФЫВ — движение<br>
        • Пробел — прыжок<br>
        • Левый клик — сломать блок<br>
        • Правый клик — поставить блок<br>
        • Цифры 1, 2, 3 — сменить блок
    </div>
    <div id="ui">
        Текущий блок для постройки: <span id="block-name">Земля</span><div id="block-preview" style="background: #557a2b;"></div>
    </div>

    <script>
        // Инициализация сцены, камеры и рендера
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x78a7ff);
        scene.fog = new THREE.FogExp2(0x78a7ff, 0.035);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(20, 40, 20);
        scene.add(directionalLight);

        // Константы размеров мира и физики
        const BLOCK_SIZE = 1;
        const WORLD_SIZE = 20; 
        const GRAVITY = 0.012;
        const JUMP_FORCE = 0.22;
        const SPEED = 0.08;
        const PLAYER_HEIGHT = 1.6;

        // Игрок и физика
        let player = {
            pos: new THREE.Vector3(10, 10, 10),
            velocity: new THREE.Vector3(),
            onGround: false
        };
        camera.position.copy(player.pos);

        // Цвета для кубов (вместо тяжелых картинок-текстур)
        const blockTypes = {
            1: { name: 'Земля с травой', color: 0x557a2b },
            2: { name: 'Камень', color: 0x808080 },
            3: { name: 'Доски', color: 0xa07040 }
        };
        let activeBlockType = 1;

        // Создаем геометрию куба
        const geometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        const blocks = {}; // Хранилище всех блоков в мире по координатам "x,y,z"
        const blockObjects = new Map(); // Карта связи Mesh -> координаты

        function addBlock(x, y, z, type) {
            const key = `${x},${y},${z}`;
            if (blocks[key]) return;

            const material = new THREE.MeshLambertMaterial({ color: blockTypes[type].color });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            
            blocks[key] = type;
            blockObjects.set(mesh, {x, y, z, key});
        }

        function removeBlock(mesh) {
            const data = blockObjects.get(mesh);
            if (data) {
                scene.remove(mesh);
                delete blocks[data.key];
                blockObjects.delete(mesh);
            }
        }

        // Генерация стартового ландшафта (холмистая земля)
        for (let x = 0; x < WORLD_SIZE; x++) {
            for (let z = 0; z < WORLD_SIZE; z++) {
                // Простая формула высоты для неровности рельефа
                let height = Math.floor(Math.sin(x * 0.3) * 1.5 + Math.cos(z * 0.3) * 1.5) + 3;
                for (let y = 0; y <= height; y++) {
                    let type = 2; // Камень внутри
                    if (y === height) type = 1; // Трава сверху
                    addBlock(x, y, z, type);
                }
            }
        }

        // Управление мышью (Pointer Lock API)
        const keys = {};
        let pitch = 0, yaw = 0;

        document.body.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== document.body) return;
            yaw -= e.movementX * 0.0025;
            pitch -= e.movementY * 0.0025;
            pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
            
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
        });

        // Клавиатура
        window.addEventListener('keydown', (e) => { 
            keys[e.code] = true; 
            if(e.code === 'Digit1') switchBlock(1);
            if(e.code === 'Digit2') switchBlock(2);
            if(e.code === 'Digit3') switchBlock(3);
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        function switchBlock(id) {
            activeBlockType = id;
            document.getElementById('block-name').innerText = blockTypes[id].name;
            document.getElementById('block-preview').style.background = '#' + blockTypes[id].color.toString(16);
        }

        // Логика разрушения и строительства блоков через Raycaster (лучи)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(0, 0); // Центр экрана

        window.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement !== document.body) return;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children);
            
            if (intersects.length > 0 && intersects[0].distance < 6) {
                const hit = intersects[0];
                
                if (e.button === 0) { // Левый клик — ломаем
                    removeBlock(hit.object);
                } 
                else if (e.button === 2) { // Правый клик — строим
                    const normal = hit.normal;
                    const pos = hit.object.position;
                    // Вычисляем координаты нового блока на основе нормали стороны, куда кликнули
                    const newX = Math.round(pos.x + normal.x);
                    const newY = Math.round(pos.y + normal.y);
                    const newZ = Math.round(pos.z + normal.z);
                    
                    addBlock(newX, newY, newZ, activeBlockType);
                }
            }
        });

        // Отключаем стандартное меню правого клика мыши
        window.addEventListener('contextmenu', e => e.preventDefault());

        // Главный игровой цикл (Обновление физики и рендер)
        function animate() {
            requestAnimationFrame(animate);

            // Направление движения игрока
            const changeX = (keys['KeyD'] || keys['KeyW'] || keys['KeyA'] || keys['KeyS'] ? SPEED : 0);
            const moveVector = new THREE.Vector3();
            
            if (keys['KeyW']) moveVector.z -= 1;
            if (keys['KeyS']) moveVector.z += 1;
            if (keys['KeyA']) moveVector.x -= 1;
            if (keys['KeyD']) moveVector.x += 1;
            moveVector.normalize();
            moveVector.applyQuaternion(camera.quaternion);
            moveVector.y = 0; // Игрок двигается только по горизонтали
            moveVector.normalize().multiplyScalar(SPEED);

            if(keys['KeyW'] || keys['KeyS'] || keys['KeyA'] || keys['KeyD']) {
                player.pos.add(moveVector);
            }

            // Простая гравитация и коллизия с полом (высота блоков)
            player.velocity.y -= GRAVITY;
            player.pos.y += player.velocity.y;

            let currentBlockX = Math.round(player.pos.x);
            let currentBlockZ = Math.round(player.pos.z);
            let checkY = Math.floor(player.pos.y - PLAYER_HEIGHT);
            let standingKey = `${currentBlockX},${checkY},${currentBlockZ}`;

            if (blocks[standingKey]) { // Наступили на блок
                player.pos.y = checkY + 1 + PLAYER_HEIGHT;
                player.velocity.y = 0;
                player.onGround = true;
            } else {
                player.onGround = false;
            }

            // Прыжок
            if (keys['Space'] && player.onGround) {
